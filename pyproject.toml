[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "akita-zmodem-meshcore"
version = "1.0.0"
description = "ZMODEM-like file transfer over MeshCore companion radios"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
authors = [
    { name = "Akita Engineering", email = "info@akitaengineering.com" },
]
dependencies = [
    "meshcore==2.3.7",
    "tqdm==4.68.4",
]

[project.optional-dependencies]
dev = [
    "flake8==6.1.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
]

[project.scripts]
akita-zmodem-meshcore = "akita_zmodem_meshcore:main_entry"

[project.urls]
Homepage = "https://github.com/AkitaEngineering/Akita-Zmodem-MeshCore"

[tool.setuptools]
py-modules = ["akita_zmodem_meshcore", "zmodem", "mesh_transport"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 10
testpaths = ["tests"]
